<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b2018" />
    <meta name="description" content="Cravio : cuisiner avec ce que tu as ou trouver où sortir autour de toi, avec un assistant IA en français, anglais, arabe et darija." />
    <title>Cravio · Cuisiner ou sortir ce soir</title>
    <script>
      try {
        var t = localStorage.getItem('cravio-theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
